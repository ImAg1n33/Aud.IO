name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend/ --ignore E501

      - name: Run tests
        run: pytest

      # 阈值 0.80 的依据：实测基线 85.0%(51/60)，留出约 3 条容错。
      # 不设 0.85 是因为阈值等于基线会被 prompt 微调长期误伤 ——
      # 噪声门禁比没有门禁更糟。
      - name: Run intent eval baseline (keyword mode, no LLM)
        run: python -m eval.run_intent_eval --mode keyword --fail-below 0.80 --output eval/reports/intent-keyword-report.md

      # ⚠️ step 名必须加引号：plain scalar 里出现「冒号+空格」会让整个 YAML
      # 解析失败 —— 而 GitHub 对此不报错，只是**整个 workflow 一个 step 都不跑**
      # （连 ruff / pytest / secret scan 一起静默死掉）。这正是本项目要消灭的失效型。
      - name: "Smoke: retrieval eval gate interface intact"
        # 门禁自身也要有门禁：weekly 检索任务依赖 --fail-below 存在。
        # 只跑 --help 不够 —— 参数被删掉时 --help 照样 exit 0，必须断言参数出现在输出里。
        run: python -m eval.run_retrieval_eval --help | grep -q -- "--fail-below"

      # if: always() —— 门禁红了的时候，评估报告恰恰是最重要的诊断证据：
      # 没它就无法区分「阈值被删了」和「准确率真的掉了」。
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval/reports/

      - name: Run secret scan
        run: python scripts/security_scan.py

  frontend-tests:
    # 前端逻辑层（reducer / sse-parser / queue / speech-queue / playlist）用 Node 内置
    # node:test。必须先有本 job：否则 tests/frontend/*.mjs 从不执行，SSE 防劫持等
    # 回归保护为空。
    #
    # 必须 npm install：测试文件本身零依赖，但它们 import 的被测源码
    # （stores/chat.js、player.js、playlist.js）import pinia —— 不装会
    # ModuleNotFound，且失败只用 1 秒，容易被误判成"测试挂了"。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend runtime deps
        run: npm install --omit=dev
        working-directory: frontend

      - name: Run frontend tests
        # 必须显式 glob：文件名 test_*.mjs 不匹配 node --test 的目录默认模式
        run: node --test tests/frontend/*.mjs
