name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend/ --ignore E501

      - name: Run tests
        run: pytest

      - name: Run intent eval baseline (keyword mode, no LLM)
        run: python -m eval.run_intent_eval --mode keyword --output eval/reports/intent-keyword-report.md

      - name: Upload eval reports
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval/reports/

      - name: Run secret scan
        run: python scripts/security_scan.py

  frontend-tests:
    # 前端逻辑层（reducer / sse-parser / queue / speech-queue / playlist）用 Node 内置
    # node:test。必须先有本 job：否则 tests/frontend/*.mjs 从不执行，SSE 防劫持等
    # 回归保护为空。
    #
    # 必须 npm install：测试文件本身零依赖，但它们 import 的被测源码
    # （stores/chat.js、player.js、playlist.js）import pinia —— 不装会
    # ModuleNotFound，且失败只用 1 秒，容易被误判成"测试挂了"。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend runtime deps
        run: npm install --omit=dev
        working-directory: frontend

      - name: Run frontend tests
        # 必须显式 glob：文件名 test_*.mjs 不匹配 node --test 的目录默认模式
        run: node --test tests/frontend/*.mjs
