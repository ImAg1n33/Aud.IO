<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aud.IO — 私人 AI DJ：会听、会记、会学你的口味。" />
    <title>Aud.IO</title>
    <script>
      // 主题防闪：先于应用挂载设置 data-theme（RFC-020 §4.7）
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* 隐私模式等场景静默 */ }
      })();
    </script>
    <link rel="preload" href="/fonts/SpaceGrotesk-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SpaceMono-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
