# ============================================================
# Aud.IO Nginx 配置 — SPA 静态托管 + /api 反向代理
#
# 网络路由关系：
#   Browser → :80 (Nginx)
#                ├── /          → SPA 静态文件 (try_files → index.html)
#                ├── /assets/*  → 静态资源 (长期缓存)
#                ├── /api/*     → proxy_pass → backend:8001 (SSE 支持)
#                └── /health    → Nginx 自身健康检查
# ============================================================

upstream backend {
    # docker-compose 内部 DNS 解析 —— 服务名即主机名
    server backend:8001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- SPA 路由：所有非文件路径回退到 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 静态资源：长期缓存（Vite 构建产物带 hash） ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- API 反向代理（关键：支持 SSE 流式响应） ----
    location /api/ {
        # 去掉 /api 前缀后转发 —— /api/v1/xxx → /v1/xxx
        proxy_pass http://backend/;

        # SSE 流式传输必需配置
        proxy_buffering off;               # 禁用缓冲，实时转发每个 chunk
        proxy_cache off;                    # 禁用缓存
        proxy_read_timeout 3600s;           # 长连接超时（流式响应可能持续数分钟）
        proxy_http_version 1.1;             # HTTP/1.1 支持 keepalive
        proxy_set_header Connection "";     # 清除 Connection 头，避免 chunked 编码冲突
        chunked_transfer_encoding on;       # 支持分块传输

        # 透传客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Nginx 自身健康检查 ----
    location = /health {
        access_log off;
        return 200 "frontend OK\n";
        add_header Content-Type text/plain;
    }

    # ---- 安全加固 ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
